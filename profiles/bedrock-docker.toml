# Amazon Bedrock for the LLM, local Docker for the task sandboxes.

[llm]
route = "bedrock"
# A Bedrock API key; AMAZON_BEDROCK_API_KEY is accepted as an alias. Without
# either, LiteLLM uses the standard AWS credential chain (role, SSO, profile).
api_key_env = "AWS_BEARER_TOKEN_BEDROCK"
api_key_aliases = ["AMAZON_BEDROCK_API_KEY"]
api_key_required = false

[llm.env]
AWS_REGION = "us-east-1"
AWS_REGION_NAME = "us-east-1"

[sandbox]
environment = "docker"
