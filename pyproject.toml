[project]
name = "swe-cloud"
version = "0.1.0"
description = "SWE-Cloud: a software-engineering benchmark for AI coding agents on cloud-backed distributed systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Amazon Web Services" }]
requires-python = ">=3.12"
keywords = ["benchmark", "evaluation", "llm", "coding-agents", "software-engineering", "distributed-systems", "cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "harbor==0.24.0",
    # Imported directly (the protocol harness and the CLI); harbor brings the same versions.
    "litellm>=1.106.0",
    "python-dotenv>=1.2.4",
]

[project.urls]
Homepage = "https://github.com/awslabs/swe-cloud"
Repository = "https://github.com/awslabs/swe-cloud"
Issues = "https://github.com/awslabs/swe-cloud/issues"
Documentation = "https://github.com/awslabs/swe-cloud/tree/main/docs"

[project.scripts]
swecloud = "swecloud.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swecloud"]

[tool.uv]
# filelock comes in through harbor and huggingface-hub; releases before 4.2.1 have known CVEs.
# litellm 1.104 and later declare filelock<4, but litellm imports filelock only in its proxy
# CLI commands, which this package never loads, so the override keeps the pinned litellm.
override-dependencies = ["filelock>=4.2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
