# The floci-engines venue, offline: main is the solver's container, built from the task's Dockerfile; engines is a
# private Docker daemon holding the engine images it loads at start; Floci runs in its network namespace and starts
# each engine there. main reaches the engines Floci starts, never the daemon.
# Images are named by tag: Sail refuses a digest-pinned image in a Compose service.
services:
  main:
    networks: [venue]
    cap_add: [NET_ADMIN]
    # The single-container tasks' hardening; main keeps NET_ADMIN for the engine route floci-venue sets.
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    cap_drop:
      - MKNOD
      - NET_RAW
      - AUDIT_WRITE
      - SYS_CHROOT
      - SETFCAP
    depends_on: [floci]
  engines:
    networks: [venue]
    build: ./engines
    privileged: true
  floci:
    image: floci/floci:2.2.0
    network_mode: "service:engines"
    environment:
      FLOCI_DOCKER_DOCKER_HOST: tcp://127.0.0.1:2375
      FLOCI_SERVICES_AMAZONMQ_DEFAULT_IMAGE: rabbitmq:3.13-management
      FLOCI_SERVICES_ECS_ENABLED: "false"
      FLOCI_SERVICES_EC2_ENABLED: "false"
      FLOCI_SERVICES_EKS_ENABLED: "false"
    depends_on: [engines]
# The venue's network is declared so that runners which enforce no-network by rewriting service networking
# leave main and engines on it. It is not internal: main reaches engines by routing the engine bridge through
# engines (floci-venue), and tests connect to engine addresses Floci never reports. NAT is off, so nothing on it
# reaches outside the host's own networks, also on runners that do not seal the sandbox themselves.
networks:
  venue:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
