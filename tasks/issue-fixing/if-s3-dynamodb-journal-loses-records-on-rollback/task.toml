schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/if-s3-dynamodb-journal-loses-records-on-rollback"
description = "Fix silent record loss during a mixed-version format rollout, its rollback and the concurrent backfill of the object journal."

[metadata]
task_type = "issue_fixing"
category = "aws-floci"
engines = []
tags = ["aws", "s3", "dynamodb", "serialization", "deployment"]
difficulty_explanation = "Two coupled obligations share one S3 object body, one head revision and one control ceiling: keep every runnable build serving bounded live traffic while the JSON migration converges, and keep every current record decodable by every runnable build with every acknowledged update and every attribute retained through older-build rewrites and the sweep. The decisive state is a successful older-build update that drops a field another version wrote, and a held backfill snapshot released after live writes and a rollback."
expert_time_estimate_hours = 4.0

[metadata.source]
kind = "article"
project = "Amazon Builders' Library"
url = "https://d1.awsstatic.com/builderslibrary/pdfs/ensuring-rollback-safety-during-deployments.pdf"
date = "2019-12-05"

[verifier]
network_mode = "no-network"
timeout_sec = 600.0
environment_mode = "separate"

[agent]
network_mode = "no-network"
timeout_sec = 3600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 3072
storage_mb = 12288

[environment.healthcheck]
command = "bash /usr/local/bin/start_floci.sh"
interval_sec = 5.0
timeout_sec = 500.0
start_period_sec = 15.0
start_interval_sec = 5.0
retries = 4
