schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/if-s3-dynamodb-commit-log-version-overwritten"
description = "Keep committed table log versions permanent while their DynamoDB coordination entries are reclaimed on schedule."

[metadata]
task_type = "issue_fixing"
category = "aws-floci"
engines = []
tags = ["aws", "s3", "dynamodb", "coordination", "lost-update"]
difficulty_explanation = "A stale writer whose snapshot or absence probe predates the winner must be refused by durable object existence once the winner's coordination entry has been reclaimed, while completed entries still expire on schedule, a killed writer's incomplete entry stays recoverable, and a losing writer settles its own reservation so the table empties. The same per-version row is both disposable bookkeeping and the only exclusion evidence the old path had."
expert_time_estimate_hours = 4.0

[metadata.source]
kind = "issue"
project = "delta-io/delta"
url = "https://github.com/delta-io/delta/issues/1410"
revision = "ee945c00ecd923c78e079008c3785907866354d7"

[verifier]
network_mode = "no-network"
timeout_sec = 900.0
environment_mode = "separate"

[agent]
network_mode = "no-network"
timeout_sec = 3600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 3072
storage_mb = 12288

[environment.healthcheck]
command = "bash /usr/local/bin/start_floci.sh"
interval_sec = 5.0
timeout_sec = 500.0
start_period_sec = 15.0
start_interval_sec = 5.0
retries = 4
