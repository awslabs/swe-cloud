schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/if-dynamodb-order-dispatch-durable-replay-duplicates"
description = "Repair order dispatch recovery and duplicate suppression across durable invocations"

[metadata]
task_type = "issue_fixing"
category = "aws-floci"
engines = []
tags = ["aws", "dynamodb", "idempotency", "durable-execution"]
difficulty_explanation = "Bundle admission spans more shared delivery identities than fit in one DynamoDB transaction. Partial acquisition, overlapping payloads, parent reservation generations, cached receipt retention and stale in-flight writes must remain consistent across fresh processes and uncertain outcomes."
expert_time_estimate_hours = 4.0

[metadata.source]
kind = "pull-request"
project = "aws-powertools/powertools-lambda-python"
url = "https://github.com/aws-powertools/powertools-lambda-python/pull/7764"
revision = "d561d12f2727a3619b53944de66617f932108435"

[verifier]
network_mode = "no-network"
timeout_sec = 420.0
environment_mode = "separate"

[agent]
network_mode = "no-network"
timeout_sec = 3600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 3072
storage_mb = 12288

[environment.healthcheck]
command = "bash /usr/local/bin/start_floci.sh"
interval_sec = 5.0
timeout_sec = 500.0
start_period_sec = 15.0
start_interval_sec = 5.0
retries = 4
