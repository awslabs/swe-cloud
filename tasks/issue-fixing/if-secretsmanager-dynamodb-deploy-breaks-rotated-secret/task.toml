schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/if-secretsmanager-dynamodb-deploy-breaks-rotated-secret"
description = "Repair secret-version reconciliation in a rotation-enabled deployment"

[metadata]
task_type = "issue_fixing"
category = "aws-floci"
engines = []
tags = ["aws", "secretsmanager", "dynamodb"]
difficulty_explanation = "Deployment and rotation share a staging label, but their progress records have separate commit boundaries. Saved plans must still converge after rotation."
expert_time_estimate_hours = 4.0

[metadata.source]
kind = "issue"
project = "hashicorp/terraform-provider-aws"
url = "https://github.com/hashicorp/terraform-provider-aws/issues/19212"
revision = "a98686fb98f9c0511531f8711f20d41355d5f090"

[verifier]
network_mode = "no-network"
timeout_sec = 600.0
environment_mode = "separate"

[agent]
network_mode = "no-network"
timeout_sec = 3600

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 3072
storage_mb = 12288

[environment.healthcheck]
command = "bash /usr/local/bin/start_floci.sh"
interval_sec = 5.0
timeout_sec = 500.0
start_period_sec = 15.0
start_interval_sec = 5.0
retries = 4
