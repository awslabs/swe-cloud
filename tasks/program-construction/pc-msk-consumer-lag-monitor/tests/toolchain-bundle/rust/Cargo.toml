# Offline crate set for solvers: AWS SDK, async runtime, common formats, and clients for the task engines.
[package]
name = "task-crates"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
aws-sdk-sns = "1"
aws-sdk-dynamodb = "1"
aws-sdk-kinesis = "1"
aws-sdk-kms = "1"
aws-sdk-ssm = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-sts = "1"
aws-sdk-iam = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-eventbridge = "1"
aws-sdk-route53 = "1"
aws-sdk-glue = "1"
aws-sdk-firehose = "1"
aws-sdk-lambda = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio-postgres = "0.7"
redis = { version = "0.27", features = ["tokio-comp"] }
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
rskafka = "0.6"
