schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/pc-rds-online-ddl-migration-planner"
description = "Reconstruct a pinned AWS-backed program from its documentation and executable behavior."

[metadata]
task_type = "program_construction"
category = "aws-floci"
engines = ["postgres"]
modal_vm_runtime = true
tags = ["aws", "rds", "cli", "schema-migration", "dependency-ordering", "online-ddl", "hazard-validation"]
difficulty_explanation = "Reconstruct a PostgreSQL schema planner whose individual DDL steps, timeouts and hazard sets match across live databases and recursive SQL directories. Concurrent index replacement, temporary nullability checks, constraint validation, column packing and dependencies among sequences, enums, functions and triggers require specific multi-step plans. Apply must reject every unallowed hazard before changing the database, preserve completed steps on later failure and clean temporary databases after both successful and failed planning."
expert_time_estimate_hours = 40.0

[metadata.source]
kind = "program"
project = "stripe/pg-schema-diff"
url = "https://github.com/stripe/pg-schema-diff"
revision = "9ada4710c28718312557c84cca1be4b2557eed54"

[agent]
user = "candidate"
network_mode = "no-network"
timeout_sec = 14400

[environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 24576
build_timeout_sec = 1800

[environment.healthcheck]
command = "floci-venue up"
interval_sec = 5.0
timeout_sec = 400.0
start_period_sec = 10.0
start_interval_sec = 5.0
retries = 4

[verifier]
environment_mode = "separate"
user = "root"
network_mode = "no-network"
timeout_sec = 4800

[verifier.environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 24576
build_timeout_sec = 1800
