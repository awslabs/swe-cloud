schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/pc-kinesis-dynamodb-stream-pipeline-runner"
description = "Reconstruct a pinned AWS-backed program from its documentation and executable behavior."

[metadata]
task_type = "program_construction"
category = "aws-floci"
engines = []
modal_vm_runtime = true
tags = ["aws", "kinesis", "dynamodb", "pipeline-runner", "shard-balancing", "distributed-leases", "checkpointing", "backpressure"]
difficulty_explanation = "The candidate must reconstruct a YAML pipeline runner that consumes and publishes Kinesis records while coordinating shard leases and checkpoints through DynamoDB. Claims, renewals, theft handovers, expired owners and newly split shards require different state transitions, including rereading progress after a grace period. Batching and in-flight limits must prevent checkpoints from advancing past unacknowledged records and preserve restart behavior. Explicit shard selection, message metadata, partition routing and graceful shutdown must also match the reference."
expert_time_estimate_hours = 32.0

[metadata.source]
kind = "program"
project = "redpanda-data/connect"
url = "https://github.com/redpanda-data/connect"
revision = "9e107a9aa94bcfaa5325fc51e0ed050b80eeed03"

[agent]
user = "candidate"
network_mode = "no-network"
timeout_sec = 14400

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800

[environment.healthcheck]
command = "floci-venue up"
interval_sec = 5.0
timeout_sec = 400.0
start_period_sec = 10.0
start_interval_sec = 5.0
retries = 4

[verifier]
environment_mode = "separate"
user = "root"
network_mode = "no-network"
timeout_sec = 4800

[verifier.environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800
