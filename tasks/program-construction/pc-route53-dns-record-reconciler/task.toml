schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/pc-route53-dns-record-reconciler"
description = "Reconstruct a pinned AWS-backed program from its documentation and executable behavior."

[metadata]
task_type = "program_construction"
category = "aws-floci"
engines = []
modal_vm_runtime = true
tags = ["aws", "route53", "cli", "dns", "desired-state", "record-reconciliation", "configuration-validation"]
difficulty_explanation = "Reconstruct a CLI that evaluates JavaScript DNS declarations, validates them offline, previews or applies Route 53 corrections and exports zones in several formats. Record sets must preserve name and target normalization, TTL rules, TXT quoting and chunking, alias fields and exact correction counts. IGNORE patterns, NO_PURGE and alias-to-record conversions must handle existing values safely, including the different effects of global configuration errors and unsafe individual zones."
expert_time_estimate_hours = 24.0

[metadata.source]
kind = "program"
project = "DNSControl/dnscontrol"
url = "https://github.com/DNSControl/dnscontrol"
revision = "329c40e606c239dc1748d3b3553538fa0eb774c3"

[agent]
user = "candidate"
network_mode = "no-network"
timeout_sec = 14400

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800

[environment.healthcheck]
command = "floci-venue up"
interval_sec = 5.0
timeout_sec = 400.0
start_period_sec = 10.0
start_interval_sec = 5.0
retries = 4

[verifier]
environment_mode = "separate"
user = "root"
network_mode = "no-network"
timeout_sec = 4800

[verifier.environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800
