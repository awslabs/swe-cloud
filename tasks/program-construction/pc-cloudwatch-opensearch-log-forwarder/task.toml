schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/pc-cloudwatch-opensearch-log-forwarder"
description = "Reconstruct a pinned AWS-backed program from its documentation and executable behavior."

[metadata]
task_type = "program_construction"
category = "aws-floci"
engines = ["opensearch"]
modal_vm_runtime = true
tags = ["aws", "cloudwatch", "sts", "opensearch", "daemon", "log-forwarding", "checkpointing", "retry-handling"]
difficulty_explanation = "The candidate must reconstruct a configurable daemon that polls CloudWatch Logs and writes precisely shaped documents to OpenSearch. Poll timing, pagination, late events and per-group saved positions must agree across restarts, including precedence over start-time settings. Index placeholders, export-time suffixes, data-stream bulk actions and partial-failure retries must reproduce document placement and multiplicity without duplicating accepted writes."
expert_time_estimate_hours = 22.0

[metadata.source]
kind = "program"
project = "open-telemetry/opentelemetry-collector-contrib"
url = "https://github.com/open-telemetry/opentelemetry-collector-contrib"
revision = "df849b5403c041d5e799e7846392a6f18b0b55ae"

[agent]
user = "candidate"
network_mode = "no-network"
timeout_sec = 14400

[environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 24576
build_timeout_sec = 1800

[environment.healthcheck]
command = "floci-venue up"
interval_sec = 5.0
timeout_sec = 400.0
start_period_sec = 10.0
start_interval_sec = 5.0
retries = 4

[verifier]
environment_mode = "separate"
user = "root"
network_mode = "no-network"
timeout_sec = 4800

[verifier.environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 24576
build_timeout_sec = 1800
