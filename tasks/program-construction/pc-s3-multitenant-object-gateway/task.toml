schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/pc-s3-multitenant-object-gateway"
description = "Reconstruct a pinned AWS-backed program from its documentation and executable behavior."

[metadata]
task_type = "program_construction"
category = "aws-floci"
engines = []
modal_vm_runtime = true
tags = ["aws", "s3", "http-gateway", "multi-tenant", "sigv4", "bucket-ownership", "access-control", "multipart-upload", "versioning", "bucket-policy", "acl", "presigned-url", "admin-cli"]
difficulty_explanation = "The candidate must rebuild an S3-compatible gateway and its administration CLI, verifying tenant signatures (header and presigned) before forwarding with shared backend credentials. Its 167 test functions cover account maintenance, roles and bucket reassignment, ownership records, object bytes, headers, checksums, ranges and conditional requests, copies, batch deletes, tags, multipart uploads, versioning, and bucket policies, ACLs, ownership controls, CORS and website records. Policies and grants must open exactly the access they state, while foreign, internal and unregistered buckets and bad signatures get precise S3 responses without upstream mutations, and restart and late accounts keep the same boundaries."
expert_time_estimate_hours = 60.0

[metadata.source]
kind = "program"
project = "versity/versitygw"
url = "https://github.com/versity/versitygw"
revision = "e42ae7ab8107201e64e52ee024824e8cab3683b3"

[agent]
user = "candidate"
network_mode = "no-network"
timeout_sec = 14400

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800

[environment.healthcheck]
command = "floci-venue up"
interval_sec = 5.0
timeout_sec = 400.0
start_period_sec = 10.0
start_interval_sec = 5.0
retries = 4

[verifier]
environment_mode = "separate"
user = "root"
network_mode = "no-network"
timeout_sec = 4800

[verifier.environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800
