schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/pc-kms-yaml-secrets-store-cli"
description = "Reconstruct a pinned AWS-backed program from its documentation and executable behavior."

[metadata]
task_type = "program_construction"
category = "aws-floci"
engines = []
modal_vm_runtime = true
tags = ["aws", "kms", "cloudformation", "cli", "envelope-encryption", "yaml", "key-provisioning"]
difficulty_explanation = "The candidate must reconstruct a YAML secrets CLI with interoperable AES-GCM and secretbox envelopes, fresh KMS data keys and encryption contexts bound to secret names. Key templates, explicit references, duplicate entries and fallback decryption interact with exact binary plaintext output and export statuses that count failed attempts. Label provisioning must reproduce CloudFormation parameters, aliases and optional IAM roles while preserving existing secrets and unrelated labels. Failed writes and guarded deprovisioning must leave the expected file and AWS state intact."
expert_time_estimate_hours = 24.0

[metadata.source]
kind = "program"
project = "dcoker/biscuit"
url = "https://github.com/dcoker/biscuit"
revision = "682b1eb542577edd42208f20b255143784a15cd0"

[agent]
user = "candidate"
network_mode = "no-network"
timeout_sec = 14400

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800

[environment.healthcheck]
command = "floci-venue up"
interval_sec = 5.0
timeout_sec = 400.0
start_period_sec = 10.0
start_interval_sec = 5.0
retries = 4

[verifier]
environment_mode = "separate"
user = "root"
network_mode = "no-network"
timeout_sec = 4800

[verifier.environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800
