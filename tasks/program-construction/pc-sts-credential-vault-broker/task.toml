schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/pc-sts-credential-vault-broker"
description = "Reconstruct a pinned AWS-backed program from its documentation and executable behavior."

[metadata]
task_type = "program_construction"
category = "aws-floci"
engines = []
modal_vm_runtime = true
tags = ["aws", "sts", "iam", "cli", "credential-vault", "session-caching", "key-rotation"]
difficulty_explanation = "The candidate must rebuild an encrypted credential store and CLI for resolving profiles, exporting STS credentials, running children and rotating IAM keys. Its 47 test functions distinguish user-session caching from fresh role assumptions, duration precedence and role-chain caps, profile inheritance and loops, and selective cache invalidation. Export formats, aligned listings, the complete child environment and preserved state after failed rotation or a wrong passphrase must match alongside independently validated AWS credentials."
expert_time_estimate_hours = 26.0

[metadata.source]
kind = "program"
project = "ByteNess/aws-vault"
url = "https://github.com/ByteNess/aws-vault"
revision = "5dcbf4d615b7e057fe64c1394181349d5017c413"

[agent]
user = "candidate"
network_mode = "no-network"
timeout_sec = 14400

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800

[environment.healthcheck]
command = "floci-venue up"
interval_sec = 5.0
timeout_sec = 400.0
start_period_sec = 10.0
start_interval_sec = 5.0
retries = 4

[verifier]
environment_mode = "separate"
user = "root"
network_mode = "no-network"
timeout_sec = 4800

[verifier.environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 12288
build_timeout_sec = 1800
