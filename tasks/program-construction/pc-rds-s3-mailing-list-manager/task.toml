schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "swe-cloud/pc-rds-s3-mailing-list-manager"
description = "Reconstruct a pinned AWS-backed program from its documentation and executable behavior."

[metadata]
task_type = "program_construction"
category = "aws-floci"
engines = ["postgres"]
modal_vm_runtime = true
tags = ["aws", "rds", "s3", "http-server", "subscriber-management", "csv-import", "bounce-handling", "media-storage"]
difficulty_explanation = "Reconstruct an authenticated mailing-list API with database installation, settings reload, subscriber profiles, per-list memberships, segmentation and bulk actions. CSV and ZIP imports must preserve independent profile and membership overwrite rules, while bounce thresholds, domain restrictions and soft failures of email attempts produce the correct stored state. Media uploads must keep database metadata, S3 keys, object bytes, content types, thumbnails and public or presigned URLs consistent through duplicate filenames, deletion and restarts."
expert_time_estimate_hours = 40.0

[metadata.source]
kind = "program"
project = "knadh/listmonk"
url = "https://github.com/knadh/listmonk"
revision = "ef0a75872463f10a4848af6c547d1c057405453a"

[agent]
user = "candidate"
network_mode = "no-network"
timeout_sec = 14400

[environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 24576
build_timeout_sec = 1800

[environment.healthcheck]
command = "floci-venue up"
interval_sec = 5.0
timeout_sec = 400.0
start_period_sec = 10.0
start_interval_sec = 5.0
retries = 4

[verifier]
environment_mode = "separate"
user = "root"
network_mode = "no-network"
timeout_sec = 4800

[verifier.environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 24576
build_timeout_sec = 1800
